[workspace]
members = ["agent", "agent-executor", "agent-protocol", "api", "terminal-capability"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
chrono = { version = "0.4", features = ["serde"] }
hkdf = "0.12"
http = "1.3"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal"] }
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2.6"
tar = "0.4"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.2"
utoipa = { version = "5.4", features = ["axum_extras"] }
zeroize = "1.8"
