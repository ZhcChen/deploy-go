# deploy-go 是多模块仓库；这里是 Rust 子系统的 virtual workspace 清单，
# 不是一个代表整个项目的 Rust package。Web、Flutter、文档、示例和部署脚本
# 分别位于 admin/、admin-app/、docs/、examples/ 和 deploy/。
# 保留仓库根作为 Cargo workspace 入口，用于共享依赖版本、Cargo.lock、工具链
# 以及跨 crate 的构建和测试；项目级全量检查仍应使用根目录 Makefile。
[workspace]
members = ["agent", "agent-executor", "agent-protocol", "agent-updater", "api", "container-template", "deploy-go-deployer", "release-authorization", "runtime-log", "terminal-capability"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
flate2 = "1.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hkdf = "0.12"
hmac = "0.12"
http = "1.3"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal"] }
portable-pty = "0.9"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2.6"
tar = "0.4"
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1.2"
utoipa = { version = "5.4", features = ["axum_extras"] }
zeroize = "1.8"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
