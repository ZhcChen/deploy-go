[package]
name = "deploy-go-agent-executor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:portable-pty"]

[[bin]]
name = "deploy-go-agent-executor"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
deploy-go-terminal-capability = { path = "../terminal-capability" }
deploy-go-release-authorization = { path = "../release-authorization" }
libc.workspace = true
portable-pty = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ulid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
