# 用途: 提供 PostgreSQL 连接、内存、WAL、日志和时区基础配置。
# 推荐调整: 按节点内存和连接规模调整 max_connections/shared_buffers，并按备份策略调整 WAL 参数。
# 默认关系: 文件由 compose.yaml 只读挂载，时区默认与 compose.env 的 TZ 保持 Asia/Shanghai。
# 安全边界: 不得修改监听/认证边界以绕过网络控制，也不得引用模板目录外的文件或动态加载项。
listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB
log_timezone = 'Asia/Shanghai'
timezone = 'Asia/Shanghai'
