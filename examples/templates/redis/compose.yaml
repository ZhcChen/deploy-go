# 用途: 定义 Redis 服务、端口、健康检查、配置挂载和持久化数据卷。
# 推荐调整: 通过 compose.env 修改宿主端口；持久化和内存参数在 redis.conf 中调整。
# 默认关系: REDIS_PORT 默认 6379，密码来自 redis.env，健康检查使用同一密码。
# 安全边界: 不得启用特权/宿主命名空间、挂载 Docker socket、覆盖启动命令或增加越界宿主路径。
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - redis.env
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-data:
