services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.14
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - etcd.env
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      ETCD_ADVERTISE_CLIENT_URLS: "http://127.0.0.1:${ETCD_CLIENT_PORT:-2379}"
    ports:
      - "127.0.0.1:${ETCD_CLIENT_PORT:-2379}:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  etcd-data:
