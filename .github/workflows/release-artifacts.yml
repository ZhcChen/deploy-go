name: Build Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag used when publishing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-release-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          RELEASE_TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$REF_NAME"
          elif [ "$PUBLISH_RELEASE" = "true" ]; then
            if [ -z "$INPUT_RELEASE_TAG" ]; then
              echo "release_tag is required when publish_release=true" >&2
              exit 1
            fi
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          fi

          if [ -n "$RELEASE_TAG" ] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  api-check:
    name: API check
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run API checks
        run: make api-check

  api-build:
    name: Build API ${{ matrix.arch }}
    needs: api-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "deploy-go-api:${{ github.sha }}-${{ matrix.arch }}" \
            --file api/docker/release/Dockerfile \
            .

      - name: Export API artifacts
        run: |
          set -euo pipefail
          mkdir -p .artifacts/api

          IMAGE="deploy-go-api:${{ github.sha }}-${{ matrix.arch }}"
          CONTAINER_ID="$(docker create "$IMAGE")"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CONTAINER_ID:/app/deploy-go-api" ".artifacts/api/deploy-go-api-linux-${{ matrix.arch }}"
          chmod +x ".artifacts/api/deploy-go-api-linux-${{ matrix.arch }}"

          tar -C .artifacts/api -czf ".artifacts/api/deploy-go-api-linux-${{ matrix.arch }}.binary.tar.gz" "deploy-go-api-linux-${{ matrix.arch }}"
          docker save "$IMAGE" | gzip -9 > ".artifacts/api/deploy-go-api-linux-${{ matrix.arch }}.docker.tar.gz"

          (
            cd .artifacts/api
            sha256sum \
              "deploy-go-api-linux-${{ matrix.arch }}" \
              "deploy-go-api-linux-${{ matrix.arch }}.binary.tar.gz" \
              "deploy-go-api-linux-${{ matrix.arch }}.docker.tar.gz" \
              > "deploy-go-api-linux-${{ matrix.arch }}.sha256"
          )

      - name: Upload API artifacts
        uses: actions/upload-artifact@v6
        with:
          name: api-linux-${{ matrix.arch }}-release
          path: .artifacts/api/*
          if-no-files-found: error
          include-hidden-files: true

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    needs:
      - validate-release-inputs
      - api-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: .artifacts/downloaded

      - name: Collect release assets
        env:
          RESOLVED_RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED_RELEASE_TAG"
          echo "RELEASE_TAG=$RESOLVED_RELEASE_TAG" >> "$GITHUB_ENV"

          mkdir -p .artifacts/publish-assets
          find .artifacts/downloaded -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" ".artifacts/publish-assets/$(basename "$file")"
          done

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .artifacts/publish-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Deploy Go $RELEASE_TAG" \
              --notes-file .artifacts/release-notes.md \
              "${PRERELEASE_ARGS[@]}"
          else
            gh release create "$RELEASE_TAG" .artifacts/publish-assets/* \
              --title "Deploy Go $RELEASE_TAG" \
              --notes-file .artifacts/release-notes.md \
              "${PRERELEASE_ARGS[@]}"
          fi
